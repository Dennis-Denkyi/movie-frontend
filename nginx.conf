server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Send unknown paths (e.g. /favourites on refresh) to React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite adds a content hash to built filenames, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
